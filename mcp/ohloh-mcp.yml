- name: list_organizations
  description: List organizations tracked by Open Hub.
  resource: /organizations.xml
- name: get_analysis
  description: Retrieve the current best analysis for a project.
  resource: /p/{project}/analyses/latest.xml
- name: list_languages
  description: List programming languages known to Open Hub with usage stats.
  resource: /languages.xml
- name: get_language
  description: Retrieve a single programming language profile.
