apis:
- aid: ohloh:open-hub-api
  name: Open Hub API (Ohloh)
  humanURL: https://github.com/blackducksoftware/ohloh_api
  baseURL: https://www.openhub.net
  description: >-
    The REST API for Black Duck Open Hub (formerly Ohloh). Returns XML wrapped in
    a <response> root element that always carries a <status> (success/failed) and
    an <error> on failure. Requests append .xml to a resource URL and pass the
    api_key HTTP parameter; write operations and private account data use OAuth
    2.0. Collections return at most 25 items per page (page parameter, one-based;
    query and sort parameters) and report items_returned, items_available and
    first_item_position. Resources include projects, accounts, organizations,
    analyses, languages, stacks, factoids, kudos, positions and contributor
    facts.
  tags:
