aid: ohloh
name: Ohloh
description: >-
  Ohloh is the open source directory and analytics service that was rebranded as
  Black Duck Open Hub (openhub.net) after Black Duck Software acquired it. It
  tracks hundreds of thousands of open source projects, their code, contributors,
  languages, licenses and activity, and exposes this data through a public REST
  API. The Open Hub / Ohloh API returns XML, authenticates with an api_key HTTP
  parameter (plus OAuth 2.0 for write access and private account data), is rate
  limited to 1,000 requests per key per day, and covers resources such as
  projects, accounts, organizations, analyses, languages, stacks, factoids and
  contributor facts. This profile was added to the API Evangelist network as a
  stub and enriched from the provider's public documentation.
